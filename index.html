<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Club</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <img src="images/logo.png" alt="Movie Club" class="login-logo-img">
                <h1>MOVIE CLUB</h1>
                <p>Your private cinema circle</p>
            </div>

            <div class="form-group">
                <label for="username">Member</label>
                <select id="username">
                    <option value="">Select your name...</option>
                    <option value="Aaron">Aaron</option>
                    <option value="Alex">Alex</option>
                    <option value="Jamie">Jamie</option>
                    <option value="Joey">Joey</option>
                    <option value="Kevin">Kevin</option>
                </select>
            </div>

            <div class="form-group">
                <label for="pin">PIN</label>
                <input type="password" id="pin" placeholder="••••"
                       maxlength="6" inputmode="numeric">
            </div>

            <button id="login-btn" class="btn-primary">Sign In</button>
            <p id="error-msg" class="error hidden"></p>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
